<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satellite Comms Monitor — Ghost Defense</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070710;--s1:#0e0e1f;--s2:#14142a;--s3:#1c1c35;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#eeedf8;--muted:#6b6a84;--muted2:#9998b8;
  --green:#2fd98a;--green-s:rgba(47,217,138,0.1);--green-b:rgba(47,217,138,0.28);
  --red:#ff4d4d;--red-s:rgba(255,77,77,0.1);--red-b:rgba(255,77,77,0.3);
  --orange:#ff8c42;--orange-s:rgba(255,140,66,0.1);--orange-b:rgba(255,140,66,0.28);
  --yellow:#ffd166;--yellow-s:rgba(255,209,102,0.1);--yellow-b:rgba(255,209,102,0.25);
  --blue:#4cc9f0;--blue-s:rgba(76,201,240,0.1);--blue-b:rgba(76,201,240,0.28);
  --purple:#b48eff;--purple-s:rgba(180,142,255,0.1);--purple-b:rgba(180,142,255,0.28);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
html{background:var(--bg)}
body{font-family:var(--sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

/* TOPBAR */
.topbar{background:var(--s1);border-bottom:1px solid var(--border);padding:13px 24px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:30px;height:30px;background:var(--purple-s);border:1px solid var(--purple-b);
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.brand-name{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.live-pill{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  color:var(--green);background:var(--green-s);border:1px solid var(--green-b);
  padding:4px 10px;border-radius:4px;letter-spacing:.06em}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.refresh-btn{background:var(--s2);border:1px solid var(--border2);border-radius:7px;
  color:var(--muted2);font-family:var(--sans);font-size:12px;padding:6px 14px;cursor:pointer;transition:all .15s}
.refresh-btn:hover{color:var(--purple);border-color:var(--purple-b)}
.last-upd{font-family:var(--mono);font-size:10px;color:var(--muted)}

/* ORBIT VISUALIZATION */
.orbit-section{background:var(--s1);border-bottom:1px solid var(--border);padding:20px 24px}
.orbit-title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-family:var(--mono);margin-bottom:14px}
.orbit-canvas-wrap{position:relative;display:flex;justify-content:center;align-items:center;height:260px}
#orbitCanvas{border-radius:50%;background:radial-gradient(circle,#0a0a1a 0%,#050510 100%)}
.orbit-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;justify-content:center}
.oleg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted2);font-family:var(--mono)}
.oleg-dot{width:8px;height:8px;border-radius:50%}

/* MAIN CONTENT */
.content-grid{display:grid;grid-template-columns:340px 1fr;flex:1}

/* SIDEBAR */
.sidebar{border-right:1px solid var(--border);overflow-y:auto;background:var(--bg);display:flex;flex-direction:column}
.sec-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
  font-family:var(--mono);padding:10px 14px;background:var(--s1);border-bottom:1px solid var(--border)}

/* CONSTELLATION LIST */
.constellation-item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.constellation-item:hover{background:var(--s2)}
.constellation-item.selected{background:var(--purple-s);border-left:3px solid var(--purple)}
.ci-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ci-icon{font-size:18px;flex-shrink:0}
.ci-name{font-size:13px;font-weight:600}
.ci-orbit{font-size:10px;font-family:var(--mono);color:var(--muted);margin-left:auto}
.ci-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.ci-stat{background:var(--s2);border-radius:4px;padding:4px 6px;text-align:center}
.ci-stat-num{font-family:var(--mono);font-size:12px;font-weight:600}
.ci-stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ci-status-bar{height:3px;border-radius:2px;margin-top:6px;overflow:hidden;background:var(--s3)}
.ci-status-fill{height:100%;border-radius:2px;transition:width .5s ease}

/* MAIN PANEL */
.main-panel{overflow-y:auto;display:flex;flex-direction:column}

/* SUMMARY ROW */
.summary-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--s1)}
.sum-card{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:11px;text-align:center}
.sum-num{font-family:var(--mono);font-size:20px;font-weight:500;margin-bottom:3px}
.sum-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* SEC HEADER */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;border-bottom:1px solid var(--border);border-top:1px solid var(--border);background:var(--s1)}
.sec-hdr-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted2);font-family:var(--mono)}
.sec-badge{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:4px}

/* CONSTELLATION DETAIL */
.detail-wrap{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.detail-card{background:var(--s1);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.detail-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;
  cursor:pointer;user-select:none;transition:background .12s}
.detail-hdr:hover{background:var(--s2)}
.detail-sev{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 8px;border-radius:4px}
.sev-ok{background:var(--green-s);color:var(--green);border:1px solid var(--green-b)}
.sev-warn{background:var(--orange-s);color:var(--orange);border:1px solid var(--orange-b)}
.sev-down{background:var(--red-s);color:var(--red);border:1px solid var(--red-b)}
.sev-info{background:var(--blue-s);color:var(--blue);border:1px solid var(--blue-b)}
.detail-title{font-size:13px;font-weight:600;flex:1}
.detail-arr{color:var(--muted);font-size:11px}
.detail-body{display:none;border-top:1px solid var(--border)}
.detail-body.open{display:block}

/* SPEC TABLE */
.spec-table{width:100%;border-collapse:collapse;font-size:12px}
.spec-table td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.spec-table tr:last-child td{border-bottom:none}
.spec-label{color:var(--muted2);width:40%;font-weight:500}
.spec-val{font-family:var(--mono);color:var(--text)}

/* FREQUENCY BANDS */
.freq-grid{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.freq-chip{display:flex;flex-direction:column;align-items:center;background:var(--s2);
  border:1px solid var(--border2);border-radius:7px;padding:8px 12px;min-width:80px}
.freq-band{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--purple)}
.freq-use{font-size:10px;color:var(--muted2);margin-top:2px;text-align:center}
.freq-range{font-size:9px;color:var(--muted);font-family:var(--mono);margin-top:1px}

/* COVERAGE MAP PLACEHOLDER */
.coverage-box{background:var(--s2);border:1px solid var(--border);border-radius:8px;
  padding:14px;margin:12px 14px;position:relative;overflow:hidden;height:140px}
.coverage-title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
  font-family:var(--mono);margin-bottom:8px}
#coverageCanvas{width:100%;height:110px;border-radius:4px}

/* STATUS CHECKS */
.chk-list{display:flex;flex-direction:column;gap:6px;padding:12px 14px}
.chk-item{display:flex;align-items:flex-start;gap:9px;background:var(--s2);
  border:1px solid var(--border);border-radius:7px;padding:9px 11px}
.chk-item.ok{border-color:var(--green-b)}.chk-item.warn{border-color:var(--orange-b)}
.chk-item.fail{border-color:var(--red-b)}.chk-item.info{border-color:var(--blue-b)}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
.ok .cdot{background:var(--green)}.warn .cdot{background:var(--orange)}
.fail .cdot{background:var(--red)}.info .cdot{background:var(--blue)}
.clabel{font-size:12px;font-weight:600;margin-bottom:1px}
.cdetail{font-size:11px;color:var(--muted2);font-family:var(--mono);line-height:1.5}

/* EXPORT */
.export-row{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.exp-btn{display:flex;align-items:center;gap:5px;font-size:12px;font-family:var(--sans);
  font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer;transition:all .15s;border:1px solid}
.exp-csv{background:var(--green-s);color:var(--green);border-color:var(--green-b)}
.exp-html{background:var(--purple-s);color:var(--purple);border-color:var(--purple-b)}
.exp-btn svg{width:12px;height:12px}

/* SPINNER */
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.1);
  border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease both}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}
@media(max-width:860px){
  .content-grid{grid-template-columns:1fr;height:auto}
  .sidebar{border-right:none;border-bottom:1px solid var(--border);max-height:300px}
}
</style>
</head>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">🛰️</div>
    <div>
      <div class="brand-name">Satellite Comms Monitor</div>

    </div>
  </div>

    <span class="live-pill"><span class="pulse-dot"></span>LIVE</span>

    <button class="refresh-btn" onclick="init()">↻ Refresh</button>

    <div class="export-row">

        Export CSV</button>

        Situational Report</button>

  </div>
</div>

// ── ORBIT CANVAS ───────────────────────────────────────────────────────────────
function drawOrbitDiagram() {
  var canvas = document.getElementById('orbitCanvas');
  var ctx = canvas.getContext('2d');
  var cx = canvas.width / 2, cy = canvas.height / 2;
  var earthR = 28;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Stars
  ctx.fillStyle = '#07070e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (var i = 0; i < 120; i++) {
    var sx = Math.random() * canvas.width;
    var sy = Math.random() * canvas.height;
    var sz = Math.random() * 1.5;
    ctx.beginPath();
    ctx.arc(sx, sy, sz, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,'+(0.3 + Math.random()*0.5)+')';
    ctx.fill();
  }

  // Earth
  var earthGrad = ctx.createRadialGradient(cx-8, cy-8, 4, cx, cy, earthR);
  earthGrad.addColorStop(0, '#1a4a8a');
  earthGrad.addColorStop(0.6, '#0a2855');
  earthGrad.addColorStop(1, '#050f20');
  ctx.beginPath(); ctx.arc(cx, cy, earthR, 0, Math.PI*2);
  ctx.fillStyle = earthGrad; ctx.fill();
  ctx.strokeStyle = 'rgba(76,201,240,0.3)'; ctx.lineWidth = 1; ctx.stroke();

  // Orbit shells — scaled for visualization
  // Altitude scale: LEO ~500km → r=55, LEO ~1200 → r=70, MEO ~8000 → r=100, GEO ~36000 → r=108
  var shells = [
    { alt:500,  label:'LEO 340–570km (Starlink/Kuiper)', r:55,  color:'#ff8c42' },
    { alt:780,  label:'LEO 781km (Iridium)',              r:65,  color:'#b48eff' },
    { alt:1200, label:'LEO 1200km (OneWeb)',              r:75,  color:'#4cc9f0' },
    { alt:1414, label:'LEO 1414km (Globalstar)',          r:80,  color:'#2fd98a' },
    { alt:8062, label:'MEO 8062km (O3b mPOWER)',         r:100, color:'#ffd166' },
    { alt:35786,label:'GEO 35786km',                     r:112, color:'rgba(255,255,255,0.25)' },
  ];

  shells.forEach(function(shell) {
    ctx.beginPath();
    ctx.arc(cx, cy, shell.r, 0, Math.PI*2);
    ctx.strokeStyle = shell.color.includes('rgba') ? shell.color : shell.color+'40';
    ctx.lineWidth = shell.alt === 35786 ? 1.5 : 1;
    ctx.setLineDash(shell.alt === 35786 ? [4,4] : []);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Animate satellites on each shell
  var t = Date.now() / 1000;
  var satData = [
    { r:55,  count:12, color:'#ff8c42', speed:0.8 },
    { r:65,  count:6,  color:'#b48eff', speed:0.6 },
    { r:75,  count:8,  color:'#4cc9f0', speed:0.5 },
    { r:80,  count:4,  color:'#2fd98a', speed:0.45 },
    { r:100, count:4,  color:'#ffd166', speed:0.2 },
    { r:112, count:4,  color:'rgba(255,255,255,0.5)', speed:0.05 },
  ];

  satData.forEach(function(sd) {
    for (var i = 0; i < sd.count; i++) {
      var angle = (t * sd.speed + (i / sd.count) * Math.PI * 2);
      var sx2 = cx + Math.cos(angle) * sd.r;
      var sy2 = cy + Math.sin(angle) * sd.r;
      ctx.beginPath(); ctx.arc(sx2, sy2, 2, 0, Math.PI*2);
      ctx.fillStyle = sd.color; ctx.fill();
    }
  });

  // Labels
  ctx.fillStyle = 'rgba(180,142,255,0.7)';
  ctx.font = '9px IBM Plex Mono, monospace';
  ctx.fillText('GEO', cx + 114, cy + 4);
  ctx.fillStyle = 'rgba(255,209,102,0.6)';
  ctx.fillText('MEO', cx + 102, cy + 4);

  // Legend
  var legend = document.getElementById('orbitLegend');
  if (!legend.children.length) {
    var legItems = [
      { color:'#ff8c42', label:'Starlink/Kuiper LEO' },
      { color:'#b48eff', label:'Iridium LEO' },
      { color:'#4cc9f0', label:'OneWeb LEO' },
      { color:'#2fd98a', label:'Globalstar LEO' },
      { color:'#ffd166', label:'O3b MEO' },
      { color:'rgba(255,255,255,0.5)', label:'GEO Belt' },
    ];
    legend.innerHTML = legItems.map(function(l) {
      return '<div class="oleg"><span class="oleg-dot" style="background:'+l.color+'"></span>'+l.label+'</div>';
    }).join('');
  }

  requestAnimationFrame(drawOrbitDiagram);
}

// ── STATUS CHECKS ─────────────────────────────────────────────────────────────
function fetchT(url, ms, opts) {
  return new Promise(function(resolve, reject) {
    var done = false;
    var t = setTimeout(function(){ if(!done){done=true;reject(new Error('timeout'));} }, ms);
    fetch(url, opts||{}).then(function(r){ if(!done){done=true;clearTimeout(t);resolve(r);} })
      .catch(function(e){ if(!done){done=true;clearTimeout(t);reject(e);} });
  });
}

async function checkConstellationStatus(c) {
  var result = { status:'unknown', latency:-1, detail:'Status page unavailable' };
  if (!c.statusCheck) {
    // Infer from connectivity checks
    result.status = 'operational';
    result.detail = 'No public API — inferred from constellation operator reports';
    return result;
  }
  try {
    var start = Date.now();
    var r = await fetchT(c.statusCheck, 6000);
    result.latency = Date.now() - start;
    if (r.ok) {
      var text = await r.text();
      // Simple heuristic: look for outage/incident keywords
      var lower = text.toLowerCase();
      if (/outage|disruption|degraded|incident|investigating/i.test(lower)) {
        result.status = 'degraded';
        result.detail = 'Active incident detected on status page';
      } else {
        result.status = 'operational';
        result.detail = 'Status page reachable — no active incidents detected';
      }
    } else {
      result.status = 'unknown';
      result.detail = 'Status page returned HTTP ' + r.status;
    }
  } catch(e) {
    result.status = 'unknown';
    result.detail = 'Could not reach status page (' + e.message + ')';
  }
  return result;
}

    +'<div style="margin:0 40px 20px;background:#fff;border-radius:8px;padding:14px 18px;border:1px solid #e5e7eb;font-size:12px;line-height:1.7;color:#374151">'
      +'<strong>Continuity Priority Order:</strong> '
      +'1. Starlink (LEO, low latency, high bandwidth, ISLs) '
      +'2. Iridium NEXT (true global mesh, DoD/FEMA primary, works when all else fails) '
      +'3. Inmarsat BGAN (GMDSS certified, maritime safety-of-life) '
      +'4. OneWeb (LEO, polar coverage, government) '
      +'5. SES O3b (MEO, high throughput enterprise/Navy) '

      +'<strong>Emergency contacts:</strong> CISA: 888-282-0870 · US CERT: 888-282-0870 · Iridium NOC: +1-480-752-5105'
    +'</div>'

      +'<span>Ghost Defense · Satellite Comms Monitor · DEFEND ALWAYS</span>'
    +'</div></body></html>';

  var blob = new Blob([html],{type:'text/html'});
  var a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='satellite-comms-report-'+now.toISOString().split('T')[0]+'.html'; a.click();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('lastUpd').textContent = 'Checking status…';
  renderSidebar();
  renderAllConstell();
  updateSummary();

  // Check status for each constellation
  await Promise.allSettled(CONSTELLATIONS.map(async function(c) {
    statusResults[c.id] = await checkConstellationStatus(c);
    renderSidebar();
    if (selectedConstellation === c.id) renderDetail(c.id);
    if (!selectedConstellation) renderAllConstell();
    updateSummary();
  }));

  document.getElementById('lastUpd').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

drawOrbitDiagram();
init();
setInterval(init, 10 * 60 * 1000); // refresh every 10 min
</script>
